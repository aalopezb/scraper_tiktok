<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Stats</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #262a33; --text: #e8eaee;
    --muted: #8b92a1; --accent: #25f4ee; --accent2: #fe2c55;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f7; --card: #fff; --line: #e3e5ea; --text: #15171c; --muted: #6a7282; --accent: #0a9d98; --accent2: #e11d48; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 220px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 11px 18px; border: 0; border-radius: 10px; background: var(--accent2); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; font-weight: 500; }
  .tab.on { color: var(--text); border-color: var(--accent); }
  .err { color: var(--accent2); margin-top: 10px; min-height: 1em; }
  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #fff; flex: none; }
  .name { font-weight: 700; font-size: 17px; }
  .user { color: var(--muted); }
  .bio { color: var(--muted); margin: 0 0 14px; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat small { color: var(--muted); }
  .bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 12px; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .tag { font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 1px 8px; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; cursor: pointer; user-select: none; }
  .scroll { overflow-x: auto; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .note { color: var(--muted); margin-top: 10px; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  summary { cursor: pointer; }
  .cm { list-style: none; padding: 0; margin: 8px 0 0; }
  .cm li { padding: 6px 0; border-bottom: 1px dashed var(--line); word-break: break-word; }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .alerts { margin: 10px 0; padding-left: 18px; color: var(--accent2); }
  .fine { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 7px 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span>TikTok</span> Stats</h1>
  <p class="sub">Datos públicos de perfiles y videos.</p>

  <div class="panel">
    <div class="tabs">
      <button class="tab on" data-mode="profile" type="button">Perfil</button>
      <button class="tab" data-mode="video" type="button">Video</button>
      <button class="tab" data-mode="analysis" type="button">Análisis (5 videos)</button>
    </div>
    <form id="form">
      <input id="q" placeholder="@usuario" autocomplete="off" required>
      <button id="go" type="submit">Buscar</button>
    </form>
    <div class="err" id="err"></div>
    <div class="note" id="status"></div>
  </div>

  <div id="results"></div>

  <div class="panel" id="cmp" hidden>
    <h2>Comparar perfiles (clic en una columna para ordenar)</h2>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-k="usuario">Usuario</th><th data-k="seguidores">Seguidores</th>
          <th data-k="seguidos">Seguidos</th><th data-k="me_gustas_totales">Me gustas</th>
          <th data-k="videos">Videos</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="actions"><button class="ghost" id="csv" type="button">Descargar CSV</button></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => (n ?? 0).toLocaleString("es");
const compact = (n) => new Intl.NumberFormat("es", { notation: "compact", maximumFractionDigits: 1 }).format(n ?? 0);
let mode = "profile";
const profiles = [];
let sortKey = "seguidores", sortDir = -1;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function stat(label, value) {
  const s = el("div", "stat");
  s.append(el("b", "", compact(value)), el("small", "", label));
  s.title = fmt(value);
  return s;
}

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
  t.classList.add("on");
  mode = t.dataset.mode;
  $("#q").placeholder = mode === "video" ? "https://www.tiktok.com/@usuario/video/…" : "@usuario";
  $("#go").textContent = mode === "analysis" ? "Analizar" : "Buscar";
  $("#q").value = "";
}));

function profileCard(p) {
  const c = el("div", "panel");
  const head = el("div", "head");
  head.append(el("div", "avatar", (p.nombre || p.usuario || "?")[0].toUpperCase()));
  const who = el("div");
  const n = el("div", "name", p.nombre || "");
  if (p.verificado) n.append(el("span", "tag", "verificado"));
  who.append(n, el("div", "user", "@" + p.usuario));
  head.append(who);
  c.append(head);
  if (p.bio) c.append(el("p", "bio", p.bio));
  const g = el("div", "grid");
  g.append(stat("Seguidores", p.seguidores), stat("Seguidos", p.seguidos),
           stat("Me gustas totales", p.me_gustas_totales), stat("Videos", p.videos));
  c.append(g);
  return c;
}

function videoCard(v) {
  const c = el("div", "panel");
  const head = el("div", "head");
  head.append(el("div", "avatar", (v.nombre || v.usuario || "?")[0].toUpperCase()));
  const who = el("div");
  who.append(el("div", "name", v.nombre || ""), el("div", "user", "@" + v.usuario));
  head.append(who);
  c.append(head);
  if (v.descripcion) c.append(el("p", "bio", v.descripcion));
  const g = el("div", "grid");
  g.append(stat("Me gustas", v.me_gustas), stat("Comentarios", v.comentarios),
           stat("Compartidos", v.compartidos), stat("Guardados", v.guardados),
           stat("Reproducciones", v.reproducciones), stat("Interacciones", v.interacciones));
  c.append(g);
  const rate = v["tasa_interaccion_%"];
  c.append(el("div", "", ""));
  const label = el("small", "user", "Tasa de interacción: " + rate + "%");
  label.style.display = "block"; label.style.marginTop = "12px";
  const bar = el("div", "bar"), fill = el("i");
  fill.style.width = Math.min(rate * 5, 100) + "%";
  bar.append(fill);
  c.append(label, bar);
  return c;
}

const scoreColor = (s) => (s >= 70 ? "var(--accent)" : s >= 45 ? "#d99a00" : "var(--accent2)");
const SVGNS = "http://www.w3.org/2000/svg";

function svg(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function barChart(videos) {
  const W = 640, H = 300, L = 36, B = 40, T = 14, R = 8;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Valor y veracidad por video" });
  const ph = H - T - B, pw = W - L - R;
  [0, 25, 50, 75, 100].forEach((g) => {
    const y = T + ph - (g / 100) * ph;
    const line = svg("line", { x1: L, x2: W - R, y1: y, y2: y });
    line.style.stroke = "var(--line)";
    const lab = svg("text", { x: L - 6, y: y + 4, "text-anchor": "end", "font-size": 11 }, g);
    lab.style.fill = "var(--muted)";
    s.append(line, lab);
  });
  const slot = pw / videos.length, bw = Math.min(34, slot / 3);
  videos.forEach((v, i) => {
    const cx = L + slot * i + slot / 2;
    [["valor", "--accent", -bw - 2], ["veracidad", "--accent2", 2]].forEach(([key, color, dx]) => {
      const val = v[key], h = (val / 100) * ph;
      const r = svg("rect", { x: cx + dx, y: T + ph - h, width: bw, height: Math.max(h, 1), rx: 4 });
      r.style.fill = `var(${color})`;
      r.append(svg("title", {}, `${key}: ${val}`));
      const t = svg("text", { x: cx + dx + bw / 2, y: T + ph - h - 4, "text-anchor": "middle", "font-size": 11 }, Math.round(val));
      t.style.fill = "var(--text)";
      s.append(r, t);
    });
    const d = svg("text", { x: cx, y: H - B + 18, "text-anchor": "middle", "font-size": 12 }, (v.fecha || "").slice(5, 10));
    d.style.fill = "var(--text)";
    s.append(d);
  });
  return s;
}

function scoreBox(title, score, label) {
  const b = el("div", "stat");
  const big = el("b", "", String(Math.round(score)));
  big.style.color = scoreColor(score);
  b.append(big, el("small", "", `${title} · ${label}`));
  const bar = el("div", "bar"), fill = el("i");
  fill.style.width = score + "%";
  bar.append(fill);
  b.append(bar);
  return b;
}

function videoDetails(v, i) {
  const d = document.createElement("details");
  const sm = document.createElement("summary");
  const desc = (v.descripcion || "(sin descripción)").slice(0, 60);
  sm.textContent = `V${i + 1} · ${(v.fecha || "").slice(0, 10)} · ${desc} — Valor ${Math.round(v.valor)} / Veracidad ${Math.round(v.veracidad)}`;
  d.append(sm);
  const g = el("div", "grid");
  g.style.marginTop = "10px";
  g.append(stat("Reproducciones", v.reproducciones), stat("Me gustas", v.me_gustas),
           stat("Comentarios", v.comentarios), stat("Compartidos", v.compartidos), stat("Guardados", v.guardados));
  const er = el("div", "stat");
  er.append(el("b", "", v.metricas.tasa_interaccion + "%"), el("small", "", "Tasa de interacción"));
  g.append(er);
  d.append(g);
  if (v.alertas.length) {
    const ul = el("ul", "alerts");
    v.alertas.forEach((a) => ul.append(el("li", "", a)));
    d.append(ul);
  }
  if (v.comentarios_muestra.length) {
    d.append(el("small", "user", "Muestra de comentarios"));
    const ul = el("ul", "cm");
    v.comentarios_muestra.forEach((c) => ul.append(el("li", "", `@${c.usuario}: ${c.texto}  (♥ ${c.likes})`)));
    d.append(ul);
  } else {
    d.append(el("small", "user", "Sin comentarios en la muestra."));
  }
  const a = el("a", "", "Abrir video en TikTok");
  a.href = v.url; a.target = "_blank"; a.rel = "noopener";
  a.style.cssText = "display:block;margin-top:8px;color:var(--accent)";
  d.append(a);
  return d;
}

function analysisCard(d) {
  const p = d.perfil || {}, acc = d.cuenta;
  const c = el("div", "panel");
  const head = el("div", "head");
  head.append(el("div", "avatar", (p.nombre || p.usuario || "?")[0].toUpperCase()));
  const who = el("div");
  who.append(el("div", "name", p.nombre || p.usuario || ""), el("div", "user", "@" + (p.usuario || "")));
  head.append(who);
  c.append(head);

  const g = el("div", "grid");
  g.append(scoreBox("Valor", acc.valor, acc.etiqueta_valor), scoreBox("Veracidad", acc.veracidad, acc.etiqueta_veracidad),
           stat("Seguidores", p.seguidores), stat("Videos analizados", acc.videos_analizados));
  c.append(g);

  if (acc.alertas.length) {
    const ul = el("ul", "alerts");
    acc.alertas.forEach((a) => ul.append(el("li", "", a)));
    c.append(ul);
  }

  const h = el("h2", "", "Valor y veracidad por video (de más antiguo a más reciente)");
  h.style.marginTop = "18px";
  c.append(h, barChart([...d.videos].reverse()));
  const lg = el("div", "legend");
  lg.innerHTML = '<span><i style="background:var(--accent)"></i>Valor</span><span><i style="background:var(--accent2)"></i>Veracidad</span>';
  c.append(lg);

  d.videos.forEach((v, i) => c.append(videoDetails(v, i)));
  c.append(el("p", "fine",
    "Valor = qué tan bien rinde el contenido (interacción, alcance, conversación, sentimiento). " +
    "Veracidad = qué tan orgánica parece la interacción (proporciones y calidad de comentarios). " +
    "Son heurísticas sobre una muestra pequeña: indicios, no pruebas."));
  return c;
}

function renderTable() {
  $("#cmp").hidden = profiles.length < 1;
  const rows = [...profiles].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
  });
  const tb = $("#tbody");
  tb.replaceChildren();
  rows.forEach((p) => {
    const tr = el("tr");
    tr.append(el("td", "", "@" + p.usuario), el("td", "", fmt(p.seguidores)),
              el("td", "", fmt(p.seguidos)), el("td", "", fmt(p.me_gustas_totales)), el("td", "", fmt(p.videos)));
    tb.append(tr);
  });
}

document.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : -1;
  sortKey = k;
  renderTable();
}));

$("#csv").addEventListener("click", () => {
  const cols = ["nombre", "usuario", "seguidores", "seguidos", "me_gustas_totales", "videos"];
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.join(","), ...profiles.map((p) => cols.map((c) => esc(p[c])).join(","))].join("\n");
  const a = el("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
  a.download = "perfiles.csv";
  a.click();
});

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  const btn = $("#go");
  $("#err").textContent = "";
  btn.disabled = true; btn.textContent = "Buscando…";
  $("#status").textContent = mode === "analysis"
    ? "Analizando… se abrirá una ventana de navegador y puede tardar 1–2 minutos. Si aparece un captcha, resuélvelo ahí."
    : "";
  try {
    if (mode === "analysis") {
      const ra = await fetch("/api/analysis?n=5&c=10&u=" + encodeURIComponent(q));
      const da = await ra.json();
      if (!ra.ok) throw new Error(da.error || "Error");
      $("#results").prepend(analysisCard(da));
      return;
    }
    const url = mode === "profile"
      ? "/api/profile?u=" + encodeURIComponent(q)
      : "/api/video?url=" + encodeURIComponent(q);
    const r = await fetch(url);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Error");
    if (mode === "profile") {
      const i = profiles.findIndex((p) => p.usuario === data.usuario);
      if (i >= 0) profiles.splice(i, 1);
      profiles.push(data);
      renderTable();
    }
    $("#results").prepend(mode === "profile" ? profileCard(data) : videoCard(data));
  } catch (err) {
    $("#err").textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = mode === "analysis" ? "Analizar" : "Buscar";
    $("#status").textContent = "";
  }
});
</script>
</body>
</html>
